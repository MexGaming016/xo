<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <button onclick="addPoint()">+1</button>
            <button onclick="reset()">Reset</button>
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <button onclick="draw()">Losuj!</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d312780.3909531715!2d20.731773926151924!3d52.23254273236065!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x471ecc669a869f01%3A0x72f0be2a88ead3fc!2sWarsaw!5e0!3m2!1sen!2spl!4v1794509074766!5m2!1sen!2spl" width="234" height="200"
            style="border: 0; border-radius: 8px;" loading="lazy">
        </iframe>
        </div>

 <div class="card">
            <h2>Rysowanie</h2>
            <iframe src="https://myinstants.net/embed/?id=snd_bruh&name=bruh"
<p style="margin:4px 0 0;font:13px sans-serif"><a href="https://myinstants.net/memesounds/snd_bruh/bruh/">Bruh</a> on Myinstants.net</p>"  width="234" height="200"
            style="border: 0; border-radius: 8px;">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
